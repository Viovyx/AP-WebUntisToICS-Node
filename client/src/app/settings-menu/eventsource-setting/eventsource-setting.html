<div>
  <label for="schoolyear">Schoolyear:</label>
  <select name="schoolyear" [(ngModel)]="activeSchoolyear">
    @for (schoolyear of schoolyears.value() ?? []; track schoolyear.id) {
      <option [ngValue]="schoolyear">{{ schoolyear.name }}</option>
    }
  </select>
</div>
<div>
  <label for="class">Class:</label>
  <select name="class" [(ngModel)]="activeClass">
    @for (class of classes.value() ?? []; track class.id) {
      <option [ngValue]="class">{{ class.name }}</option>
    }
  </select>
</div>
