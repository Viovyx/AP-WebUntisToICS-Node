@if (shown()) {
  <app-popover (closed)="cancel()">
    <h1>Settings</h1>
    <select [(ngModel)]="activeSchoolyear">
      @for (schoolyear of schoolyears.value(); track schoolyear.id) {
        <option [ngValue]="schoolyear">{{ schoolyear.name }}</option>
      }
    </select>
    <ul>
      @for (classEl of classes.value(); track classEl.id) {
        <li
          (click)="toggleClass(classEl, activeSchoolyear().dateRange)"
          [class.selected]="selectedClasses().has(classEl)"
        >
          {{ classEl.name }}
        </li>
      }
    </ul>
    <app-action-button text="Save" color="green" (clicked)="save()" />
    <app-action-button text="Cancel" color="red" (clicked)="cancel()" />
  </app-popover>
}
