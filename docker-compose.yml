name: ap-webuntis-to-ics
services:
  client:
    build:
      context: client/.
      args:
        API_HOST: ${CLIENT_API_HOST:-http://127.0.0.1:3000}
    ports:
      - ${CLIENT_PORT:-8080}:8080

  server:
    build:
      context: server/.
    ports:
      - ${SERVER_PORT:-3000}:3000
    environment:
      - PUBLIC_URL=${SERVER_URL:-http://127.0.0.1:3000}
    env_file:
      - .env
