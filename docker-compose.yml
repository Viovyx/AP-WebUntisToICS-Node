name: ap-webuntis-to-ics
services:
  client:
    build:
      context: client/.
      args:
        API_HOST: ${CLIENT_API_HOST:-http://127.0.0.1:3000}
    ports:
      - ${CLIENT_PORT:-8080}:8080

  server:
    build:
      context: server/.
    ports:
      - ${SERVER_PORT:-3000}:3000
    environment:
      - API_BASE_URL=${SERVER_API_ENDPOINT:-https://ap.webuntis.com/WebUntis/api/rest/view/v1}
      - API_SCHOOL=${SERVER_API_SCHOOL:-ap}
      - HOST=${SERVER_INTERNAL_HOST:-0.0.0.0}
      - PORT=${SERVER_INTERNAL_PORT:-3000}
      - PUBLIC_URL=${SERVER_URL:-http://127.0.0.1:3000}
    env_file:
      - .env
